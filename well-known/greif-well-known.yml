  or SecurityTxt pointer is emitted. Three findings are worth recording because each is a trap a
  naive probe would score as a presence:
  (1) connect.greif.com returns a real RFC 9116 security.txt (HTTP 200, text/plain) — but it is NOT
  Greif's. The request 308-redirects off-host to https://www.getflip.com/.well-known/security.txt and
  the document names infosec@getflip.com. connect.greif.com is a CNAME to us01.getflip.com, a
  white-labelled Flip employee-app tenant, so the document belongs to the vendor. It is saved here as
  greif-connect-vendor-security.txt for evidence only; Greif publishes no vulnerability-disclosure
  contact of its own.
  (2) connect.greif.com and greentool.greif.com answer HTTP 200 with the same SPA shell for EVERY
  path including a random control path — soft-404 catch-alls, not documents.
  (3) plus.greif.com and portal.greif.com (the same Next.js Greif+ portal) return HTTP 200 with
  Content-Type application/json and a ZERO-byte body for /llms.txt. An empty body is not a document;
  it is recorded as a miss.
