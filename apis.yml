apis:
  - aid: greif:greif-wordpress-rest-api
    name: Greif WordPress REST API
    description: >-
      The WordPress REST API served by Greif's corporate website at https://www.greif.com/wp-json — 554
      routes across 39 namespaces, 182 of them under wp/v2, discovered by probing the API host root on
      2026-09-12. This is the only machine-readable contract Greif publishes. It is CMS infrastructure
      rather than a product — Greif runs no developer program, publishes no documentation, SDKs, pricing
      or terms for programmatic use, and every response carries x-robots-tag noindex — but unlike most
      corporate WordPress sites, Greif has registered its OWN domain entities for REST, so the surface
      carries real packaging data: product (the packaging catalog), the product_category,
      product_material, product_capacity, product_attribute, product_market, product_tag and
      regional_availability taxonomies, market, technology, sustainability_items, and the facility
      locator as wpsl_stores plus the store_location taxonomy. Anonymous reads on all of those were
      verified live; /wp/v2/settings, /wp/v2/users and /wpsl/v1/block-data return 401, and writes require
      a WordPress account on Greif's own site, which a third party cannot obtain.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/greif.png
    humanURL: https://www.greif.com/wp-json/
    baseURL: https://www.greif.com/wp-json
    tags:
