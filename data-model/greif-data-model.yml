gaps:
  - >-
    No price, stock, lead-time or specification-sheet field is exposed. The commercial data a buyer
    wants lives in the authenticated Greif+ portal, not here.
  - >-
    Only 10 product records are published on this surface, against a product catalog page that presents
    far more SKUs — the REST catalog is a subset, not the master list.
